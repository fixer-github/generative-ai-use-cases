
jobs:
  deploy:
    environment:
      name: Production
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json

          node-version: '24'
      - id: configure-aws
        name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}

          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Install dependencies
        run: npm ci

      - env:
          CDK_CONFIG_BASE64: ${{ secrets.CDK_CONFIG_BASE64 }}
        name: Decode CDK Config
        run: |
          echo "$CDK_CONFIG_BASE64" | base64 -d > packages/cdk/cdk.json

      - env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.configure-aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ steps.configure-aws.outputs.aws-region }}

        name: Bootstrap CDK
        run: npm -w packages/cdk run cdk -- bootstrap --verbose
      - env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.configure-aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ steps.configure-aws.outputs.aws-region }}

        name: Deploy CDK Stacks
        run: npm -w packages/cdk run cdk -- deploy --all --require-approval never --verbose
      - name: Validate Deployment
        run: |
          npm -w packages/cdk run cdk -- ls
          aws sts get-caller-identity
name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

