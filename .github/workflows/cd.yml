name: CD

on:
  push:
    # branches: [main]
    # tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Configure AWS Credentials via OIDC
        id: configure-aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://releases.dagger.io/dagger/install.sh | sh
          sudo mv ./bin/dagger /usr/local/bin/dagger

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run pipeline:deploy
        env:
          CI: true
          CDK_CONFIG_BASE64: ${{ secrets.CDK_CONFIG_BASE64 }}
          CDK_DEFAULT_ACCOUNT: ${{ steps.configure-aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ steps.configure-aws.outputs.aws-region }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
